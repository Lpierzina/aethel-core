[package]
name = "aethel-core"
version = "0.6.0"
edition = "2021"
description = "Post-quantum anonymous identity for Rust and WASM. A no_std alternative to static W3C DIDs: per-context identifiers, no reusable public key, zero-knowledge selective disclosure."
authors = ["Kenneth Harper"]
license = "Apache-2.0"
repository = "https://github.com/0x307/aethel-core"
keywords = ["post-quantum", "identity", "did", "wasm", "zero-knowledge"]
categories = ["cryptography", "no-std", "wasm"]
readme = "README.md"
rust-version = "1.85"
build = "build.rs"

# ── Library configuration ─────────────────────────────────────────────────────

[lib]
name = "aethel_core"
crate-type = ["cdylib", "rlib"]

# ── Dependencies ──────────────────────────────────────────────────────────────

[dependencies]

# SHA3-256 / SHAKE-256 for Fiat-Shamir challenge derivation and context expansion
sha3 = { version = "0.10", default-features = false }

# Zeroize for secure memory cleanup of secret key material.
# `alloc` is enabled unconditionally (not just via the `std` feature) so
# Vec<_>-backed intermediates (e.g. htss.rs's Shamir polynomial coefficients)
# can be zeroized in every build configuration, including the `no_std`
# component build.
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive", "alloc"] }

# Serialization for proof transcript encoding/decoding
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

# FIPS 204 ML-DSA signatures. Signing lives inside L1: the charter's "one
# artifact, adding a language never adds crypto" rule means an SDK cannot carry
# its own signature library, so aethel-core carries it and exposes it through
# the WIT world.
pqc-sig = { version = "0.4", default-features = false }

# AEAD for sealing an identity at rest. Sealing lives inside L1 for the same
# reason signing does: the SDK cannot carry a cipher without breaking "one
# artifact, adding a language never adds crypto".
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# RNG abstraction. pqc-sig takes a caller-supplied RNG rather than reaching for
# OsRng, which is what lets key generation be deterministic over caller entropy
# in a component with no ambient randomness.
rand_core = { version = "0.6", default-features = false }

wit-bindgen = { version = "0.60", default-features = false, features = ["realloc", "macros", "bitflags"], optional = true }

# ── Dev dependencies ──────────────────────────────────────────────────────────

[dev-dependencies]

# Standard RNG for tests
rand = { version = "0.8", features = ["std_rng"] }

# Hex encoding for test output
hex = "0.4"

# Compile-time "type does NOT implement trait" assertions — used to prove
# key-bearing types carry no Debug/Display impl that could format-leak them.
static_assertions = "1.1"

# Runs #[wasm_bindgen_test] tests under wasm32-unknown-unknown (via `wasm-pack
# test --node`), so the zeroization test actually executes in WASM linear
# memory, not just on native.
#
# This is a TEST HARNESS, not the retired wasm-bindgen export surface (P3-13 /
# 0X3-81). The test it runs calls the native Rust API and asserts the secret is
# wiped; what running it under wasm32 proves is that the wasm codegen path does
# not elide that write. Losing that to retire the exports would have been a bad
# trade, so the harness stays and only the exports went. It is a dev-dependency,
# so it is absent from a component build's dependency graph.
wasm-bindgen-test = "0.3"

# `rand`'s transitive `getrandom` dependency refuses to compile for
# wasm32-unknown-unknown without the "js" feature (unrelated to anything this
# crate actually does — nothing here uses OS randomness, everything is
# SHAKE-256-derived) but it's still pulled in for every `cargo test`,
# including `wasm-pack test`. Pin it directly with "js" so wasm32 test builds
# compile; on native this target block simply doesn't apply.
# wasmtime is a HOST runtime: it needs mmap and cannot compile for
# wasm32-unknown-unknown. Scoping it away from wasm32 keeps `wasm-pack test`
# working, which is the job that proves zeroization happens in WASM linear
# memory - losing that to gain the execution proof would be a bad trade.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmtime = { version = "48.0.1", default-features = false, features = ["runtime", "component-model", "cranelift"] }

# A DEV-dependency, deliberately. It exists only so `rand` (itself a
# dev-dependency) compiles under wasm32 for `wasm-pack test`; this crate uses no
# OS randomness at all, everything is SHAKE-256-derived over caller-supplied
# entropy. Declaring it as a normal dependency, which it was until P3-13 /
# 0X3-81, put getrandom and its js-sys / wasm-bindgen tail into the shipped
# component's dependency graph, so retiring the wasm-bindgen exports would not
# by itself have got wasm-bindgen out of a component build.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }

# ── Build dependencies ────────────────────────────────────────────────────────

[build-dependencies]
cc = "1.0"

# ── Feature flags ─────────────────────────────────────────────────────────────

[features]

# Default: std enabled for native builds; the component uses
# --no-default-features --features component
default = ["std"]

# std: Enable standard library support (heap allocation, I/O)
std = [
    "serde/std",
    "zeroize/std",
    "pqc-sig/std",
    "chacha20poly1305/std",
]

# enclave: Enables constant-time enclave execution paths and volatile zeroization
# Activates the fixed-iteration rejection sampling loop and CMOV selection
enclave = []

# component: Builds the WebAssembly Component Model adapter in `src/component.rs`,
# implementing the `aethel:core` WIT world with its declared types. This is the
# only WebAssembly surface; the wasm-bindgen cdylib it used to sit alongside was
# retired in P3-13 / 0X3-81.
# Non-default: it pulls wit-bindgen, and the default build of a crypto crate
# should not carry a binding generator it does not use.
component = [
    "dep:wit-bindgen",
    "std",
]

# component-tests: Runs the host-side execution proof in
# `tests/component_execution.rs`, which loads the built component in wasmtime
# and checks it against the native API. Non-default because it needs
# `aethel_core.component.wasm` to exist already (the `component` CI job builds
# it first) and because wasmtime is a heavy dev-dependency.
component-tests = []

# puf: Enables the SRAM PUF + BCH(1023,512,55) fuzzy extractor module (research,
# out of scope for the aethel:core WIT world). Non-default: excluded from the
# default build so a standard `cargo build` carries no unsafe FFI to the
# (unshipped) enclave shim for a subsystem the charter puts out of scope.
puf = []

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false              # Keep symbols for security auditing
overflow-checks = true     # Keep overflow checks in release for safety

[profile.release-wasm]
inherits = "release"
opt-level = "s"            # Optimize for binary size in WASM
strip = true               # Strip debug symbols for WASM deployment
overflow-checks = false    # Drop runtime integer overflow checks in WASM release

[profile.dev]
opt-level = 0
debug = true

[[example]]
name = "bench_wasm_penalty"
required-features = ["component-tests"]
